name: Publish PowerZen

on: workflow_dispatch
#    push:
#        paths:
#            - 'Modules/PowerZen/**'
jobs:
    build:
      name: Publish
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v7
        - name: Publish
          env:
            APIKEY: ${{ secrets.POSH_GALLERY_API_KEY }}
          run: ./Modules/Publish.ps1 -TargetFolder "PowerZen"
          shell: pwsh