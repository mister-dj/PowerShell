name: Publish GetMacAddressVendor

on:
    push:
        paths:
            - 'Modules/GetMacAddressVendor/**'
jobs:
    build:
      name: Publish
      runs-on: ubuntu-latest
      steps:
        - uses: actions/checkout@v4
        - name: Publish
          env:
            APIKEY: ${{ secrets.POSH_GALLERY_API_KEY }}
          run: ./Modules/Publish.ps1 -TargetFolder "GetMacAddressVendor"
          shell: pwsh